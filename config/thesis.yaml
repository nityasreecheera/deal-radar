# What counts as interesting.
#
# This file decides what reaches you, so it is plain text you can open and argue
# with rather than weights buried in a prompt.
#
# PLACEHOLDER. Everything below is a reasonable guess, not a real mandate. The
# questions that turn it into one:
#   - What stage do you invest at, and what is the cheque size?
#   - Which geographies are in and out?
#   - What kills a company in the first thirty seconds?
#   - What have you passed on and regretted?

# Short label for the dropdown. One word where possible.
domain: Healthcare

name: Healthcare AI and clinical software

# Which SEC industry groups to search. This is a thesis decision, not a
# technical one, so it lives here.
#
# Technology is included because that is where healthcare software actually
# files. Verified against real filings: Ambience Healthcare ($70M), Viz.ai and
# Nabla all filed under "Other Technology", not any Health Care group. Searching
# only Health Care would systematically exclude the exact companies this thesis
# is looking for — the healthcare groups are dominated by devices, therapeutics,
# clinical services, and the occasional real-estate LLC.
#
# The cost of including Technology is volume: roughly 350 extra filings a month
# against 150 healthcare ones. Every one gets enriched and judged, which is
# affordable, and there is no cheaper shortcut — names like "Abridge" and
# "Nabla" carry no signal at all, so anything relevant has to be looked up.
sec_industry_groups:
  - Other Technology
  - Computers
  - Other Health Care
  - Biotechnology
  - Pharmaceuticals
  - Hospitals and Physicians
  - Health Insurance

description: >
  Companies applying software and machine learning to clinical and healthcare
  workflows. The product is software; healthcare is the domain it operates in.

# The positive definition of the thesis.
include:
  - clinical trial recruitment, enrollment, and site selection
  - clinical documentation, coding, and revenue cycle automation
  - diagnostics and medical imaging where the product is the algorithm
  - care coordination and patient triage software
  - health data infrastructure, interoperability, and EHR tooling
  - computational drug discovery where the platform is the asset

# Disqualifying. These are the thirty-second kills.
exclude:
  - therapeutics and drug development where the asset is a molecule
  - medical devices and hardware with no meaningful software component
  - clinical service providers — clinics, practices, staffing, home care
  - dental, veterinary, cosmetic, and wellness businesses
  - health insurance carriers and benefits brokers
  - real-estate or facilities vehicles that happen to be healthcare-adjacent

# Deterministic filters, applied before anything is enriched or judged.
# Cheap checks first: there is no point paying for a lookup on a filing that a
# threshold would have removed anyway.
filters:
  # A $39 offering is a nominal filing, not a fundraise. Observed in real data.
  #
  # Lowered from 500k to 100k on 2026-08-12. At 500k the radar was dropping
  # about 41 companies a month unseen, and one of them was RevenueLens.ai — a
  # $360k raise whose name points straight at revenue cycle automation, which
  # is the second line of the include list. A pre-seed healthcare software
  # company raising 300k is exactly the kind of thing this is meant to find
  # first; 500k was quietly excluding the early end of the thesis.
  #
  # Costs about 17% more lookups a month, which stays inside the free tier.
  # Below 100k the filings are overwhelmingly nominal rather than early.
  min_offering_amount: 100000

  # An amendment restates a round already reported, so the company is not new.
  exclude_amendments: true

  # Pooled investment vehicles file Form D constantly and are never operating
  # companies. Matched as whole words against the entity name.
  exclude_name_patterns:
    - fund
    - ventures
    - spv
    - capital partners
    - holdings llc
